packages:
  - 'platforms/*'
  - 'packages/*'
  - 'test/*'

# pnpm settings live in this file, not in package.json's "pnpm" field: pnpm 11
# reads only this file (it ignores the field and warns about it). Both keys are
# kept: pnpm 10 reads `onlyBuiltDependencies`, pnpm 11 `allowBuilds`, and a
# build not allowed is an install error on pnpm 11.
onlyBuiltDependencies:
  - esbuild
  - workerd
allowBuilds:
  esbuild: true
  workerd: true
  '@parcel/watcher': false
  sharp: false
# pnpm 11 refuses a release younger than its minimum age; delegated-identity and
# @etherplay/connect were published the day this depended on them. Drop an entry
# once its release is older.
minimumReleaseAgeExclude:
  - delegated-identity@0.1.0 || 0.1.1 || 0.2.0
  - '@etherplay/connect@0.19.0'
  - '@etherplay/connect-core@0.8.0'
